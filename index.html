nav {

.categories, .games {

h2 {

}

.category-list {
    display: flex;
    flex-wrap: wrap;

.category-btn {

.category-btn:hover,

.game-container {

.game {

    border: 1px solid #292929;
    border-radius: 12px;
    overflow: hidden;
    transition: .3s;
}

.game:hover {
    transform: translateY(-7px);
    border-color: #888;
}

.game img {
    width: 100%;
    height: 165px;
    object-fit: cover;
}

.game-info {
    padding: 17px;
}

.game h3 {
    font-size: 20px;
    margin-bottom: 10px;
}

.game p {
    color: #bbb;
    font-size: 14px;
    line-height: 1.5;
    min-height: 42px;
    margin-bottom: 15px;
}

.play-btn {
    background: white;
    color: black;
    border: none;
    padding: 12px 22px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

.play-btn:hover {
    background: #ccc;
}

.empty {
    display: none;
    padding: 25px 0;
    color: #aaa;
}

#gameScreen {
    display: none;
    padding: 30px 6%;
    min-height: 450px;
}

.game-window {
    background: #111;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 25px;
    text-align: center;
}

.game-window h2 {
    margin-bottom: 20px;
}

#gameCanvas {
    background: #222;
    border: 1px solid #555;
    width: 100%;
    max-width: 650px;
    height: 300px;
    border-radius: 8px;
    touch-action: manipulation;
}

.game-controls {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.game-controls button {
    background: white;
    color: black;
    border: none;
    padding: 12px 20px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

footer {
    border-top: 1px solid #292929;
    text-align: center;
    padding: 30px;
    color: #aaa;
}

@media(max-width:650px) {
    header {

        gap: 17px;
    }

    nav {
        flex-wrap: wrap;
        justify-content: center;
    }

    .hero h1 {
        font-size: 35px;

}
</style>

let activeCategory = "Toate";

const categoryList = document.getElementById("categoryList");
const gameContainer = document.getElementById("gameContainer");
const search = document.getElementById("search");

categories.forEach(category => {
    const button = document.createElement("button");
    button.className = "category-btn";
    button.textContent = category;

    button.onclick = () => {
        activeCategory = category;
        renderCategories();
        renderGames();

        document.getElementById("games").scrollIntoView({
            behavior:"smooth"
        });
    };

    categoryList.appendChild(button);
});

function renderCategories() {
    [...categoryList.children].forEach(button => {
        button.classList.toggle(
            "active",
            button.textContent === activeCategory
        );
    });
}

function renderGames() {
    gameContainer.innerHTML = "";

    const term = search.value.toLowerCase();

    const filtered = games.filter(game =>
        (activeCategory === "Toate" ||
        game.category === activeCategory) &&
        game.name.toLowerCase().includes(term)
    );

    document.getElementById("sectionTitle").textContent =
        activeCategory === "Toate"
        ? "🔥 TOATE JOCURILE"
        : "🎮 " + activeCategory.toUpperCase();

    document.getElementById("empty").style.display =
        filtered.length ? "none" : "block";

    filtered.forEach(game => {
        const card = document.createElement("div");
        card.className = "game";

        const img = document.createElement("img");
        img.src = game.image;
        img.alt = game.name;

        const info = document.createElement("div");
        info.className = "game-info";

        const title = document.createElement("h3");
        title.textContent = game.name;

        const description = document.createElement("p");
        description.textContent = game.description;

        const button = document.createElement("button");
        button.className = "play-btn";
        button.textContent = "JOACĂ ACUM";

        button.onclick = () => {
            if(game.demo) {
                startDemo(game);
            } else {
                window.open(game.url, "_blank");
            }
        };

        info.append(title, description, button);
        card.append(img, info);
        gameContainer.appendChild(card);
    });
}

// JOCURI DEMONSTRATIVE

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let activeDemo = null;
let snake = [];
let direction = "right";
let food = {};
let score = 0;
let memoryFirst = null;
let memoryLocked = false;

function startDemo(game) {
    document.querySelector(".hero").style.display = "none";
    document.getElementById("categories").style.display = "none";
    document.getElementById("games").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    document.getElementById("gameDescription").textContent = game.description;

    activeDemo = game.demo;
    score = 0;
    canvas.style.display = "block";
    canvas.onclick = null;

    if(activeDemo === "snake") startSnake();
    if(activeDemo === "memory") startMemory();
    if(activeDemo === "chess") startChess();
}

function closeGame() {
    activeDemo = null;

    document.getElementById("gameScreen").style.display = "none";
    document.querySelector(".hero").style.display = "block";
    document.getElementById("categories").style.display = "block";
    document.getElementById("games").style.display = "block";

    document.getElementById("gameControls").innerHTML = "";
    document.getElementById("gameMessage").textContent = "";
    canvas.onclick = null;

    renderGames();
}

// SNAKE

function startSnake() {
    snake = [{x:200,y:150}];
    direction = "right";
    food = {x:300,y:150};

    document.getElementById("gameControls").innerHTML = `
    <button onclick="changeDirection('up')">SUS</button>
    <button onclick="changeDirection('left')">STÂNGA</button>
    <button onclick="changeDirection('down')">JOS</button>
    <button onclick="changeDirection('right')">DREAPTA</button>
    `;

    drawSnake();
}

function changeDirection(value) {
    if(
        (value === "up" && direction !== "down") ||
        (value === "down" && direction !== "up") ||
        (value === "left" && direction !== "right") ||
        (value === "right" && direction !== "left")
    ) {
        direction = value;
        moveSnake();
    }
}

function drawSnake() {
    ctx.fillStyle = "#222";
    ctx.fillRect(0,0,650,300);

    ctx.fillStyle = "#fff";

    snake.forEach(part => {
        ctx.fillRect(part.x,part.y,18,18);
    });

    ctx.fillStyle = "#888";
    ctx.fillRect(food.x,food.y,18,18);

    document.getElementById("gameMessage").textContent =
        "Puncte: " + score;
}

function moveSnake() {
    if(activeDemo !== "snake") return;

    const head = {...snake[0]};

    if(direction === "up") head.y -= 20;
    if(direction === "down") head.y += 20;
    if(direction === "left") head.x -= 20;
    if(direction === "right") head.x += 20;

    if(
        head.x < 0 || head.x > 630 ||
        head.y < 0 || head.y > 280 ||
        snake.some(part => part.x === head.x && part.y === head.y)
    ) {
        activeDemo = null;
        document.getElementById("gameMessage").textContent =
            "Joc terminat! Scor: " + score;
        return;
    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y) {
        score++;
        food = {
            x:Math.floor(Math.random()*31)*20,
            y:Math.floor(Math.random()*14)*20
        };
    } else {
        snake.pop();
    }

    drawSnake();
}

document.addEventListener("keydown", event => {
    if(activeDemo !== "snake") return;

    const keys = {
        ArrowUp:"up",
        ArrowDown:"down",
        ArrowLeft:"left",
        ArrowRight:"right"
    };

    if(keys[event.key]) {
        event.preventDefault();
        direction = keys[event.key];
        moveSnake();
    }
});

// MEMORY

function startMemory() {
    canvas.style.display = "none";

    const symbols = ["⭐","🌙","🔥","💎",
                     "⭐","🌙","🔥","💎"];

    symbols.sort(() => Math.random() - 0.5);

    memoryFirst = null;
    memoryLocked = false;
    score = 0;

    const controls = document.getElementById("gameControls");
    controls.innerHTML = "";

    symbols.forEach(symbol => {
        const button = document.createElement("button");
        button.textContent = "?";
        button.style.fontSize = "25px";
        button.style.width = "65px";
        button.style.height = "65px";

        button.onclick = () => {
            if(memoryLocked || button.dataset.done ||
               button.dataset.open) return;

            button.textContent = symbol;
            button.dataset.open = "yes";

            if(!memoryFirst) {
                memoryFirst = {button,symbol};
                return;
            }

            if(memoryFirst.symbol === symbol) {
                memoryFirst.button.dataset.done = "yes";
                button.dataset.done = "yes";
                memoryFirst = null;
                score++;

                document.getElementById("gameMessage").textContent =
                    "Perechi găsite: " + score;

                if(score === 4) {
                    document.getElementById("gameMessage").textContent =
                        "FELICITĂRI! AI CÂȘTIGAT!";
                }
            } else {
                memoryLocked = true;
                const first = memoryFirst.button;
                memoryFirst = null;

                setTimeout(() => {
                    if(activeDemo !== "memory") return;
                    first.textContent = "?";
                    button.textContent = "?";
                    first.dataset.open = "";
                    button.dataset.open = "";
                    memoryLocked = false;
                },700);
            }
        };

        controls.appendChild(button);
    });

    document.getElementById("gameMessage").textContent =
        "Găsește toate cele 4 perechi!";
}

// ȘAH DEMONSTRATIV

function startChess() {
    const board = [
        ["♜","♞","♝","♛","♚","♝","♞","♜"],
        ["♟","♟","♟","♟","♟","♟","♟","♟"],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["♙","♙","♙","♙","♙","♙","♙","♙"],
        ["♖","♘","♗","♕","♔","♗","♘","♖"]
    ];

    let selected = null;
    const size = 37;

    function draw() {
        ctx.fillStyle = "#111";
        ctx.fillRect(0,0,650,300);

        board.forEach((row,y) => {
            row.forEach((piece,x) => {
                ctx.fillStyle = (x+y)%2 ? "#777" : "#ddd";
                ctx.fillRect(x*size,y*size,size,size);

                ctx.fillStyle = "#222";
                ctx.font = "27px Arial";
                ctx.fillText(piece,x*size+5,y*size+29);
            });
        });
    }

    draw();

    canvas.onclick = event => {
        const rect = canvas.getBoundingClientRect();

        const x = Math.floor(
            (event.clientX-rect.left)*canvas.width/rect.width/size
        );

        const y = Math.floor(
            (event.clientY-rect.top)*canvas.height/rect.height/size
        );

        if(x > 7 || y > 7) return;

        if(selected) {
            board[y][x] = board[selected.y][selected.x];
            board[selected.y][selected.x] = "";
            selected = null;
            draw();
        } else if(board[y][x]) {
            selected = {x,y};
            document.getElementById("gameMessage").textContent =
                "Alege o poziție pentru piesă.";
        }
    };

    document.getElementById("gameMessage").textContent =
        "Șah demonstrativ: selectează și mută piesele.";
}

let gameTimer;
let stopGame = false;

function openGame(name, instructions) {
  stopGame = false;
  document.getElementById("games").style.display = "none";
  document.getElementById("gameArea").style.display = "block";
  document.getElementById("gameTitle").textContent = name;
  document.getElementById("gameInstructions").textContent = instructions;
  document.getElementById("gameContent").innerHTML = "";
}

function closeGame() {
  stopGame = true;
  clearInterval(gameTimer);
  document.getElementById("gameArea").style.display = "none";
  document.getElementById("games").style.display = "grid";
}

/* SNAKE */
function startSnake() {
  openGame("Snake", "Folosește săgețile tastaturii.");
  const c = document.createElement("canvas");
  c.width = 400; c.height = 400;
  document.getElementById("gameContent").append(c);
  const ctx = c.getContext("2d");
  let snake = [{x:10,y:10}], food = {x:15,y:15};
  let dx=1,dy=0,score=0;

  document.onkeydown = e => {
    if(e.key==="ArrowUp"&&dy!==1){dx=0;dy=-1}
    if(e.key==="ArrowDown"&&dy!==-1){dx=0;dy=1}
    if(e.key==="ArrowLeft"&&dx!==1){dx=-1;dy=0}
    if(e.key==="ArrowRight"&&dx!==-1){dx=1;dy=0}
  };

  clearInterval(gameTimer);
  gameTimer=setInterval(()=>{
    if(stopGame)return;
    let head={x:snake[0].x+dx,y:snake[0].y+dy};
    if(head.x<0||head.x>=20||head.y<0||head.y>=20||
       snake.some(p=>p.x===head.x&&p.y===head.y)){
      clearInterval(gameTimer);
      document.getElementById("gameInstructions").textContent="Ai pierdut! Scor: "+score;
      return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
      score++;
      food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};
    }else snake.pop();

    ctx.fillStyle="black";ctx.fillRect(0,0,400,400);
    ctx.fillStyle="lime";
