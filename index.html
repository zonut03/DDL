<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DDL Birou de Proiectare</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }

    header {
      padding: 20px 40px;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      text-decoration: none;
    }

    .logo-mark {
      display: block;
      width: 135px;
      height: 42px;
    }

    .logo span {
      margin-top: 5px;
      color: #000;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    main {
      min-height: 500px;
      padding: 100px 40px;
      color: white;
      background: #344b39;
    }

    h1 {
      max-width: 650px;
      font-family: Georgia, serif;
      font-size: 52px;
      font-weight: normal;
    }

    p {
      max-width: 550px;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="#" aria-label="DDL Birou de Proiectare">
      <svg class="logo-mark" viewBox="0 0 135 42" aria-hidden="true">
        <rect x="0" y="0" width="135" height="42" fill="#000"></rect>
        <path d="M8 7 H23 C41 7 41 35 23 35 H8"
              fill="none" stroke="#fff" stroke-width="4"></path>
        <path d="M49 7 H64 C82 7 82 35 64 35 H49"
              fill="none" stroke="#fff" stroke-width="4"></path>
        <path d="M96 7 V35 H127"
              fill="none" stroke="#fff" stroke-width="4"></path>
      </svg>
      <span>Birou de proiectare</span>
    </a>
  </header>

  <main>
    <h1>Proiectul tău începe cu o idee bine construită.</h1>
    <p>Proiectare de arhitectură și consultanță pentru locuințe și clădiri gândite să răspundă nevoilor tale.</p>
  </main>
</body>
</html>
