
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STYLEHUB | Fashion Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #171717;
}

header {
    background: #111;
    color: white;
    padding: 25px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo span {
    color: #c5f36a;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-size: 14px;
}

.hero {
    background: #dce2d6;
    padding: 85px 8%;
    text-align: center;
}

.hero h1 {
    font-size: 55px;
    margin-bottom: 15px;
}

.hero p {
    margin-bottom: 25px;
    color: #555;
}

.hero a {
    background: #111;
    color: white;
    padding: 15px 30px;
    text-decoration: none;
    display: inline-block;
}

.brands {
    background: white;
    padding: 25px;
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 20px;
    font-weight: bold;
    font-size: 20px;
}

h2 {
    text-align: center;
    margin: 45px 0 25px;
    font-size: 30px;
}

.filters {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 20px 25px;
}

input, select {
    padding: 12px;
    border: 1px solid #ddd;
    background: white;
}

.products {
    padding: 10px 7% 60px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.card {
    background: white;
    cursor: pointer;
    transition: .3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 260px;
    object-fit: cover;
}

.info {
    padding: 15px;
}

.info h3 {
    margin: 8px 0;
    font-size: 16px;
}

.info p {
    color: #777;
    font-size: 13px;
    margin-bottom: 8px;
}

.price {
    font-weight: bold;
    color: #111 !important;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #000b;
    justify-content: center;
    align-items: center;
    padding: 15px;
    z-index: 10;
}

.modal-content {
    background: white;
    padding: 30px;
    width: 400px;
    max-width: 100%;
    position: relative;
    text-align: center;
}

.modal-content img {
    width: 100%;
    height: 230px;
    object-fit: cover;
}

.close {
    position: absolute;
    right: 15px;
    top: 10px;
    border: none;
    background: white;
    font-size: 25px;
    cursor: pointer;
}

.sizes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 20px 0;
}

.sizes button {
    padding: 12px;
    border: 1px solid #ccc;
    background: white;
    cursor: pointer;
}

.sizes button.selected {
    background: #111;
    color: white;
}

.buy {
    display: block;
    background: #111;
    color: white;
    padding: 15px;
    text-decoration: none;
    margin-top: 15px;
}

.buy.disabled {
    opacity: .4;
    pointer-events: none;
}

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 35px;
}

@media(max-width: 850px) {
    .products {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 500px) {
    header {
        flex-direction: column;
        gap: 18px;
    }

    nav a {
        margin: 0 8px;
    }

    .hero h1 {
        font-size: 38px;
    }

    .products {
        padding: 10px 4% 40px;
        gap: 10px;
    }

    .card img {
        height: 180px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">STYLE<span>HUB</span></div>
    <nav>
        <a href="#home">HOME</a>
        <a href="#produse">HAINE</a>
        <a href="#produse">SNEAKERS</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>FIND YOUR STYLE.</h1>
    <p>Discover the latest fashion and sneakers.</p>
    <a href="#produse">SHOP NOW</a>
</section>

<div class="brands">
    <span>NIKE</span>
    <span>ADIDAS</span>
    <span>ZARA</span>
    <span>PUMA</span>
    <span>LEVI'S</span>
    <span>H&M</span>
</div>

<h2 id="produse">OUR COLLECTION</h2>

<div class="filters">
    <input id="search" placeholder="Caută un produs...">

    <select id="category">
        <option value="all">Toate produsele</option>
        <option value="Haine">Haine</option>
        <option value="Sneakers">Sneakers</option>
    </select>

    <select id="brand">
        <option value="all">Toate brandurile</option>
        <option>Nike</option>
        <option>Adidas</option>
        <option>Zara</option>
        <option>Puma</option>
        <option>Levi's</option>
        <option>H&M</option>
    </select>
</div>

<div class="products" id="products"></div>

<div class="modal" id="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal()">×</button>
        <img id="modalImage" src="" alt="Produs">
        <h2 id="modalName"></h2>
        <p id="modalPrice"></p>
        <p>Alege mărimea:</p>
        <div class="sizes" id="sizes"></div>
        <a id="buy" class="buy disabled" target="_blank" rel="noopener">
            ALEGE O MĂRIME
        </a>
    </div>
</div>

<footer>
    <h2>STYLEHUB</h2>
    <p>Fashion is a way to express yourself.</p>
    <p>© 2026 STYLEHUB. All rights reserved.</p>
</footer>

<script>
const products = [
    {
        name: "Nike Air Force 1",
        brand: "Nike",
        category: "Sneakers",
        price: 549,
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700",
        sizes: ["36","37","38","39","40","41","42","43","44"]
    },
    {
        name: "Adidas Campus",
        brand: "Adidas",
        category: "Sneakers",
        price: 499,
        image: "https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=700",
        sizes: ["36","37","38","39","40","41","42","43"]
    },
    {
        name: "Nike Hoodie",
        brand: "Nike",
        category: "Haine",
        price: 249,
        image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=700",
        sizes: ["XS","S","M","L","XL"]
    },
    {
        name: "Zara Jacket",
        brand: "Zara",
        category: "Haine",
        price: 229,
        image: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=700",
        sizes: ["S","M","L","XL"]
    },
    {
        name: "Puma Suede",
        brand: "Puma",
        category: "Sneakers",
        price: 329,
        image: "https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=700",
        sizes: ["36","37","38","39","40","41","42","43"]
    },
    {
        name: "Levi's Jeans",
        brand: "Levi's",
        category: "Haine",
        price: 299,
        image: "https://images.unsplash.com/photo-1542272604-787c3835535d?w=700",
        sizes: ["28","30","32","34","36"]
    },
    {
        name: "Adidas T-Shirt",
        brand: "Adidas",
        category: "Haine",
        price: 99,
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=700",
        sizes: ["XS","S","M","L","XL"]
    },
    {
        name: "H&M Sweatshirt",
        brand: "H&M",
        category: "Haine",
        price: 119,
        image: "https://images.unsplash.com/photo-1578681994506-b8f463449011?w=700",
        sizes: ["XS","S","M","L","XL"]
    }
];

const container = document.getElementById("products");

function displayProducts() {
    const search = document.getElementById("search").value.toLowerCase();
    const category = document.getElementById("category").value;
    const brand = document.getElementById("brand").value;

    const filtered = products.filter(p =>
        p.name.toLowerCase().includes(search) &&
        (category === "all" || p.category === category) &&
        (brand === "all" || p.brand === brand)
    );

    container.innerHTML = "";

    filtered.forEach((p) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="${p.image}" alt="${p.name}">
            <div class="info">
                <p>${p.brand} · ${p.category}</p>
                <h3>${p.name}</h3>
                <p class="price">${p.price} LEI</p>
                <p>Apasă pentru mărimi →</p>
            </div>
        `;

        card.onclick = () => openProduct(p);
        container.appendChild(card);
    });

    if (!filtered.length) {
        container.innerHTML = "<p>Nu am găsit produse.</p>";
    }
}

function openProduct(p) {
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalImage").src = p.image;
    document.getElementById("modalName").textContent = p.name;
    document.getElementById("modalPrice").textContent = p.price + " LEI";

    const sizes = document.getElementById("sizes");
    sizes.innerHTML = "";

    const buy = document.getElementById("buy");
    buy.href = "#";
    buy.classList.add("disabled");
    buy.textContent = "ALEGE O MĂRIME";

    p.sizes.forEach(size => {
        const button = document.createElement("button");
        button.textContent = size;

        button.onclick = () => {
            sizes.querySelectorAll("button").forEach(b =>
                b.classList.remove("selected")
            );

            button.classList.add("selected");

            buy.classList.remove("disabled");
            buy.textContent = "CAUTĂ PRODUSUL";

            buy.href = "https://www.google.com/search?tbm=shop&q=" +
                encodeURIComponent(p.brand + " " + p.name + " marimea " + size);
        };

        sizes.appendChild(button);
    });
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

document.getElementById("search").addEventListener("input", displayProducts);
document.getElementById("category").addEventListener("change", displayProducts);
document.getElementById("brand").addEventListener("change", displayProducts);

document.getElementById("modal").addEventListener("click", e => {
    if (e.target.id === "modal") closeModal();
});

displayProducts();
</script>

</body>
</html>
